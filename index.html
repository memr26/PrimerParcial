<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primer parcial</title>

  <style>
    body {
      margin: 0;
      padding: 50px 20px;
      text-align: center;
      font-family: Arial, sans-serif;
      color: white;
      background-color: #6954d9;
    }

    main {
      max-width: 600px;
      margin: auto;
      padding: 35px;
      border-radius: 15px;
      background-color: #8d7be8;
      box-shadow: 0 5px 15px #4c3da0;
    }

    h1 {
      font-size: 38px;
    }

    p {
      font-size: 18px;
      line-height: 1.5;
    }

    span {
      display: inline-block;
      margin-top: 15px;
      padding: 10px 18px;
      border-radius: 20px;
      color: #6954d9;
      background-color: white;
    }
  </style>
</head>

<body>
  <main>
    <h1>Transmision desde el primer parcial</h1>

    <p>
      Esta pequena pagina viajo de GitHub a Surge
      sin que nadie tuviera que subirla a mano.
    </p>

    <p>
      Si estas viendo esto, el despliegue automatico funciono.
    </p>

    <span>GitHub + Surge + un poco de fe</span>
  </main>
</body>
</html>
